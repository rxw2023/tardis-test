<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>塔迪斯测试 · 骨架预览</title>
<link rel="stylesheet" href="style.css">
<script src="public/vendor/p5.min.js"></script>
<script src="public/vendor/p5.brush.js"></script>
</head>
<body>
<header>
  <h1>《塔迪斯测试》骨架预览 <span class="tag">阶段 1 · 无声</span></h1>
</header>

<main id="stage"></main>

<footer id="controls">
  <button id="btn-play" title="播放/暂停（空格）">▶</button>
  <input id="seek" type="range" min="0" max="137" step="0.02" value="0">
  <span id="time">0:00 / 2:17</span>
  <span id="section">片头</span>
  <label class="loop"><input id="loop" type="checkbox" checked> 循环</label>
  <span class="hint">空格播放 · ←/→ 跳 5 秒</span>
</footer>

<script type="module" src="src/main/main.js"></script>
</body>
</html>
