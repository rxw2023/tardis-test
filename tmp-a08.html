<!DOCTYPE html>
<html><body><script type="module">
import { buildBuses, makeSectionIO, arrangeScene, crossingSound } from './src/audio/engine.js';
import a08 from './src/audio/sections/a08-mughal.js';
import { SCENE_LEN } from './src/beat/beats.js';

const PRESET = { scale: 'bhairav', octave: 0, sends: { hall: 0.36 } };
let buf = null;

window.__render = {
  scene: async (i, sr) => {
    const lead = 0.4, len = lead + SCENE_LEN + 1.4;
    const ctx = new OfflineAudioContext(2, Math.ceil(len * (sr || 48000)), sr || 48000);
    const bus = buildBuses(ctx);
    const mod = { ...PRESET, ...a08 };
    const io = makeSectionIO(ctx, bus, mod.sends);
    arrangeScene(ctx, bus, io, 7, lead, mod);
    crossingSound(ctx, bus, lead, { gain: 0.95 });
    buf = await ctx.startRendering();
    window.__buf = buf;
    return buf.duration;
  },
};

window.__prepareWav = () => {
  const b = window.__buf || buf;
  if (!b) return null;
  const n = b.length, ch = b.numberOfChannels;
  const i16 = new Int16Array(n * ch);
  const data = [];
  for (let c = 0; c < ch; c++) data.push(b.getChannelData(c));
  for (let i = 0; i < n; i++) {
    for (let c = 0; c < ch; c++) {
      let v = data[c][i];
      v = v < -1 ? -1 : v > 1 ? 1 : v;
      i16[i * ch + c] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
  }
  window.__i16 = i16;
  return { n, ch, sampleRate: b.sampleRate, bytes: i16.byteLength };
};
window.__chunkB64 = (startBytes, lenBytes) => {
  const u8 = new Uint8Array(window.__i16.buffer, startBytes, lenBytes);
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
};
window.__ready = true;
</script></body></html>
